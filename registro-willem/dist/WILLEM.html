  <style>
/* =====================================================================
   Registro WILLEM · Arrixaca — hoja de estilos (sin dependencias externas)
   ===================================================================== */
:root {
  --bg: #f2f5fa;
  --bg-2: #e9eef6;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --ink: #0d1726;
  --ink-2: #44546a;
  --ink-3: #8794a8;
  --line: #e3e8f0;
  --line-2: #d3dbe7;
  --brand: #0f766e;
  --brand-2: #14b8a6;
  --brand-ink: #ffffff;
  --brand-soft: #e6f6f4;
  --ok: #16a34a;
  --ok-soft: #e7f7ed;
  --warn: #d97706;
  --warn-soft: #fff4e0;
  --bad: #dc2626;
  --bad-soft: #fde9e9;
  --side-1: #0a1322;
  --side-2: #12223a;
  --side-ink: #c8d3e3;
  --side-ink-2: #7d8ca3;
  --shadow-1: 0 1px 2px rgba(13, 23, 38, .06), 0 1px 1px rgba(13, 23, 38, .04);
  --shadow-2: 0 10px 30px -12px rgba(13, 23, 38, .22), 0 2px 6px rgba(13, 23, 38, .05);
  --shadow-3: 0 24px 60px -20px rgba(13, 23, 38, .35);
  --r-1: 10px;
  --r-2: 16px;
  --r-3: 22px;
  --c: var(--brand);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --bg: #0b111b; --bg-2: #0f1724; --surface: #131c2a; --surface-2: #182233; --ink: #e8eef7; --ink-2: #a9b6c9;
    --ink-3: #6f7d92; --line: #223047; --line-2: #2c3b55; --brand-soft: #0f2b2a; --ok-soft: #10281b; --warn-soft: #2e2210;
    --bad-soft: #2f1416; --side-1: #070c14; --side-2: #0c1523; color-scheme: dark;
    --shadow-2: 0 10px 30px -12px rgba(0, 0, 0, .6); --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, .7);
  }
}
:root[data-tema="oscuro"] {
  --bg: #0b111b; --bg-2: #0f1724; --surface: #131c2a; --surface-2: #182233; --ink: #e8eef7; --ink-2: #a9b6c9;
  --ink-3: #6f7d92; --line: #223047; --line-2: #2c3b55; --brand-soft: #0f2b2a; --ok-soft: #10281b; --warn-soft: #2e2210;
  --bad-soft: #2f1416; --side-1: #070c14; --side-2: #0c1523; color-scheme: dark;
  --shadow-2: 0 10px 30px -12px rgba(0, 0, 0, .6); --shadow-3: 0 24px 60px -20px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.45; color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
.ico { width: 20px; height: 20px; flex: none; }
.oculto { display: none !important; }
::selection { background: color-mix(in srgb, var(--brand-2) 35%, transparent); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px;
  cursor: pointer; transition: transform .12s, box-shadow .2s, background .2s, border-color .2s; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); box-shadow: var(--shadow-1); }
.btn:active { transform: translateY(1px); }
.btn .ico { width: 18px; height: 18px; }
.btn.primario { background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 70%, var(--brand-2))); color: #fff; border-color: transparent; box-shadow: 0 6px 18px -8px var(--brand); }
.btn.primario:hover { box-shadow: 0 10px 24px -10px var(--brand); filter: brightness(1.05); }
.btn.color { background: var(--c); color: #fff; border-color: transparent; box-shadow: 0 6px 18px -8px var(--c); }
.btn.fantasma { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.fantasma:hover { background: var(--surface-2); box-shadow: none; }
.btn.peligro { color: var(--bad); }
.btn.peligro:hover { border-color: var(--bad); }
.btn.pequeno { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.grande { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 14px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn-icono { width: 38px; padding: 0; justify-content: center; }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.lateral {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 14px;
  background: radial-gradient(120% 60% at 0% 0%, color-mix(in srgb, var(--brand) 30%, transparent), transparent 60%),
              linear-gradient(180deg, var(--side-2), var(--side-1));
  color: var(--side-ink); z-index: 5;
}
.marca { display: flex; align-items: center; gap: 12px; padding: 6px 8px 20px; }
.marca .logo {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(140deg, #14b8a6, #0f766e 55%, #164e63); box-shadow: 0 8px 22px -8px #14b8a6;
}
.marca .logo .ico { width: 26px; height: 26px; }
.marca b { display: block; color: #fff; font-size: 18px; letter-spacing: .14em; }
.marca span { font-size: 12px; color: var(--side-ink-2); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .titulo { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--side-ink-2); padding: 16px 12px 6px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; color: var(--side-ink);
  font-weight: 500; transition: background .15s, color .15s; position: relative;
}
.nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; }
.nav a.activo { background: rgba(255, 255, 255, .1); color: #fff; }
.nav a.activo::before { content: ""; position: absolute; left: -14px; top: 9px; bottom: 9px; width: 4px; border-radius: 0 4px 4px 0; background: var(--brand-2); }
.nav .contador { margin-left: auto; font-size: 12px; background: rgba(255, 255, 255, .1); padding: 1px 8px; border-radius: 99px; }
.nuevo-caso {
  margin: 4px 0 8px; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 13px;
  background: linear-gradient(135deg, #14b8a6, #0d9488); color: #fff; font-weight: 700; box-shadow: 0 10px 24px -12px #14b8a6;
}
.nuevo-caso:hover { filter: brightness(1.07); }
.pie-lateral { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.tarjeta-usuario { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 13px; background: rgba(255, 255, 255, .05); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none;
  background: linear-gradient(135deg, #6366f1, #14b8a6); font-size: 14px;
}
.tarjeta-usuario .n { color: #fff; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tarjeta-usuario .r { font-size: 12px; color: var(--side-ink-2); }
.tarjeta-usuario button { margin-left: auto; background: none; border: 0; color: var(--side-ink-2); cursor: pointer; padding: 6px; border-radius: 8px; }
.tarjeta-usuario button:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.cinta-demo { font-size: 12px; text-align: center; padding: 7px; border-radius: 10px; background: rgba(245, 158, 11, .14); color: #fbbf24; font-weight: 600; letter-spacing: .04em; }
.local-ok { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--side-ink-2); padding: 0 6px; }
.local-ok .ico { width: 16px; height: 16px; color: #34d399; }

.principal { min-width: 0; display: flex; flex-direction: column; }
.barra {
  position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 14px; padding: 14px 32px; min-height: 68px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid transparent;
}
.barra.sombra { border-bottom-color: var(--line); }
.barra h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.barra .migas { font-size: 13px; color: var(--ink-3); }
.barra .der { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.contenido { padding: 8px 32px 48px; max-width: 1480px; width: 100%; }

/* ---------- Tarjetas ---------- */
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-2); box-shadow: var(--shadow-1); }
.tarjeta.pad { padding: 20px 22px; }
.tarjeta h3 { margin: 0 0 4px; font-size: 15px; }
.tarjeta .sub { color: var(--ink-3); font-size: 13px; }
.grid { display: grid; gap: 18px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-panel { grid-template-columns: 1.15fr 1fr 1fr; }
@media (max-width: 1250px) { .g5 { grid-template-columns: repeat(3, 1fr); } .g-panel { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; } .lateral { position: static; height: auto; }
  .g4, .g5, .g3, .g2, .g-panel { grid-template-columns: 1fr; }
  .contenido, .barra { padding-left: 16px; padding-right: 16px; }
}

/* ---------- Panel ---------- */
.saludo {
  position: relative; overflow: hidden; border-radius: var(--r-3); padding: 28px 30px; color: #fff; margin-bottom: 18px;
  background: radial-gradient(90% 140% at 100% 0%, rgba(20, 184, 166, .55), transparent 55%),
              radial-gradient(70% 120% at 0% 100%, rgba(99, 102, 241, .35), transparent 60%),
              linear-gradient(135deg, #0b2033, #0f3b4a);
  box-shadow: var(--shadow-2);
}
.saludo h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
.saludo p { margin: 6px 0 0; color: rgba(255, 255, 255, .75); max-width: 640px; }
.saludo .acciones { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
.saludo .btn { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .18); backdrop-filter: blur(6px); }
.saludo .btn.blanco { background: #fff; color: #0b2033; }
.ecg-fondo { position: absolute; right: -10px; bottom: 6px; width: 62%; height: 120px; opacity: .55; pointer-events: none; }
.ecg-fondo path { fill: none; stroke: #5eead4; stroke-width: 2; stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: trazo 3.6s ease-out forwards, latido 3.6s 3.6s ease-in-out infinite; }
@keyframes trazo { to { stroke-dashoffset: 0; } }
@keyframes latido { 50% { opacity: .55; } }

.kpi { padding: 18px 20px; display: flex; gap: 16px; align-items: center; }
.kpi .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.kpi .e { font-size: 13px; color: var(--ink-3); }

.enf-card {
  --c: var(--brand); position: relative; overflow: hidden; padding: 18px; border-radius: var(--r-2); cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: transform .18s, box-shadow .2s, border-color .2s;
}
.enf-card::after { content: ""; position: absolute; inset: auto -30% -60% auto; width: 160px; height: 160px; border-radius: 50%; background: var(--c); opacity: .08; transition: opacity .2s, transform .3s; }
.enf-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--c) 40%, var(--line)); }
.enf-card:hover::after { opacity: .14; transform: scale(1.15); }
.enf-card .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 65%, #000)); box-shadow: 0 8px 20px -10px var(--c); }
.enf-card .ic .ico { width: 24px; height: 24px; }
.enf-card .num { font-size: 30px; font-weight: 700; margin-top: 14px; letter-spacing: -.02em; }
.enf-card .nom { font-weight: 600; font-size: 14px; }
.enf-card .barra-p { margin-top: 12px; }

.barra-p { height: 7px; border-radius: 99px; background: var(--bg-2); overflow: hidden; }
.barra-p > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 60%, #fff)); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.mini { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; margin-top: 6px; }

.donut-wrap { display: flex; align-items: center; gap: 22px; }
.leyenda { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.leyenda span { display: flex; align-items: center; gap: 8px; }
.leyenda i { width: 10px; height: 10px; border-radius: 3px; }
.leyenda b { margin-left: auto; padding-left: 14px; }

.actividad { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.actividad li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.actividad li:last-child { border-bottom: 0; }
.actividad .punto { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.actividad .cuando { color: var(--ink-3); font-size: 12px; }

/* ---------- Píldoras ---------- */
.pill {
  --c: var(--brand); display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 99px; font-size: 12.5px;
  font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 11%, transparent); border: 1px solid color-mix(in srgb, var(--c) 22%, transparent); white-space: nowrap;
}
.pill .ico { width: 14px; height: 14px; }
.pill.sec { font-weight: 500; padding: 2px 8px; font-size: 12px; }
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
.estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.estado.borrador { color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); }
.estado.completo { color: #2563eb; background: color-mix(in srgb, #2563eb 10%, transparent); }
.estado.validado { color: var(--ok); background: var(--ok-soft); }

/* ---------- Anillo de progreso ---------- */
.anillo { position: relative; display: inline-grid; place-items: center; }
.anillo svg { transform: rotate(-90deg); }
.anillo .fondo { stroke: var(--bg-2); }
.anillo .valor { transition: stroke-dashoffset .6s cubic-bezier(.2, .8, .2, 1); }
.anillo b { position: absolute; font-size: 12px; font-weight: 700; }

/* ---------- Tabla de casos ---------- */
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.buscador { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
.buscador .ico { position: absolute; left: 12px; top: 10px; color: var(--ink-3); }
.buscador input { width: 100%; height: 40px; padding: 0 12px 0 40px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); outline: none; }
.buscador input:focus { border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 18%, transparent); }
.chip {
  --c: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-2); transition: all .15s; user-select: none;
}
.chip .ico { width: 16px; height: 16px; color: var(--c); }
.chip:hover { border-color: var(--c); }
.chip.on { background: var(--c); border-color: var(--c); color: #fff; box-shadow: 0 6px 16px -8px var(--c); }
.chip.on .ico { color: #fff; }
.chip .n { font-size: 12px; opacity: .7; }

.tabla { width: 100%; border-collapse: separate; border-spacing: 0; }
.tabla th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.tabla th:first-child { border-top-left-radius: var(--r-2); }
.tabla th:last-child { border-top-right-radius: var(--r-2); }
.tabla td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla tbody tr { cursor: pointer; transition: background .12s; }
.tabla tbody tr:hover { background: var(--surface-2); }
.num-caso { font-family: var(--mono); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.num-caso small { color: var(--ink-3); font-weight: 400; }
.quien { font-size: 13px; color: var(--ink-2); }
.quien small { display: block; color: var(--ink-3); font-size: 12px; }
.vacio { text-align: center; padding: 60px 20px; color: var(--ink-3); }
.vacio .ico { width: 48px; height: 48px; opacity: .4; }

/* ---------- Asistente nuevo caso ---------- */
.pasos { display: flex; gap: 8px; margin-bottom: 22px; }
.paso { flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-3); font-weight: 600; font-size: 14px; }
.paso b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); color: var(--ink-2); font-size: 13px; }
.paso.on { color: var(--ink); border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 14%, transparent); }
.paso.on b { background: var(--brand); color: #fff; }
.paso.hecho b { background: var(--ok); color: #fff; }
.elige-enf { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.elige-enf .enf-card { padding: 22px; min-height: 190px; }
.elige-enf .enf-card p { color: var(--ink-2); font-size: 13.5px; margin: 10px 0 0; }
.elige-enf .enf-card h4 { margin: 16px 0 0; font-size: 17px; }
.elige-enf .enf-card.sel { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent), var(--shadow-2); }
.elige-enf .enf-card .marca-sel { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; color: #fff; transition: all .2s; }
.elige-enf .enf-card.sel .marca-sel { background: var(--c); border-color: var(--c); }
.elige-enf .enf-card .marca-sel .ico { width: 16px; height: 16px; opacity: 0; }
.elige-enf .enf-card.sel .marca-sel .ico { opacity: 1; }
.campo-num { display: flex; align-items: center; gap: 14px; }
.campo-num input { font-family: var(--mono); font-size: 34px; font-weight: 700; width: 220px; height: 70px; text-align: center; border-radius: 16px; border: 2px solid var(--line-2); background: var(--surface); letter-spacing: .08em; outline: none; }
.campo-num input:focus { border-color: var(--brand-2); }

/* ---------- Editor de caso ---------- */
.cabecera-caso {
  --c: var(--brand); position: relative; overflow: hidden; border-radius: var(--r-3); padding: 22px 26px; color: #fff; margin-bottom: 18px;
  background: radial-gradient(70% 160% at 100% 0%, color-mix(in srgb, var(--c) 70%, #fff 0%), transparent 60%), linear-gradient(135deg, color-mix(in srgb, var(--c) 82%, #000), color-mix(in srgb, var(--c) 45%, #0b1526));
  box-shadow: 0 18px 40px -22px var(--c); display: flex; gap: 22px; align-items: center; flex-wrap: wrap;
}
.cabecera-caso .ic-grande { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .25); }
.cabecera-caso .ic-grande .ico { width: 36px; height: 36px; }
.cabecera-caso .t1 { font-size: 13px; opacity: .8; text-transform: uppercase; letter-spacing: .12em; }
.cabecera-caso .t2 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.cabecera-caso .num-caso { font-size: 15px; background: rgba(0, 0, 0, .22); padding: 3px 10px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }

.cabecera-caso .pill { color: #fff; background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .25); }
.cabecera-caso .der { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.cabecera-caso .anillo .fondo { stroke: rgba(255, 255, 255, .2); }
.cabecera-caso .anillo b { font-size: 16px; }
.cabecera-caso .btn { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .25); color: #fff; }
.cabecera-caso .btn:hover { background: rgba(255, 255, 255, .22); }
.cabecera-caso select { height: 36px; border-radius: 10px; background: rgba(255, 255, 255, .14); color: #fff; border: 1px solid rgba(255, 255, 255, .25); padding: 0 10px; }
.cabecera-caso select option { color: #000; }
.guardado { font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; opacity: .9; min-width: 110px; }
.guardado .ico { width: 16px; height: 16px; }
.guardado.guardando .ico { animation: giro 1s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }

.editor { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
@media (max-width: 1050px) { .editor { grid-template-columns: 1fr; } }
.indice { position: sticky; top: 84px; padding: 10px; }
.indice a {
  --c: var(--brand); display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; color: var(--ink-2); font-weight: 500; font-size: 14px;
  transition: background .15s; position: relative;
}
.indice a:hover { background: var(--surface-2); }
.indice a.activo { background: color-mix(in srgb, var(--c) 10%, transparent); color: var(--ink); font-weight: 600; }
.indice a .marca-enf { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--c); flex: none; }
.indice a .marca-enf .ico { width: 16px; height: 16px; }
.indice a .n-sec { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--bg-2); color: var(--ink-2); font-size: 12px; font-weight: 700; flex: none; }
.indice a.ok .n-sec { background: var(--ok); color: #fff; }
.indice a .t { flex: 1; min-width: 0; line-height: 1.25; }
.indice a .p { font-size: 11.5px; color: var(--ink-3); display: block; font-weight: 500; }
.indice .mini-barra { position: absolute; left: 50px; right: 12px; bottom: 4px; height: 3px; border-radius: 3px; background: var(--bg-2); overflow: hidden; }
.indice .mini-barra i { display: block; height: 100%; background: var(--c); }
.indice .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.indice .titulo-ind { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); padding: 8px 12px 4px; }

.seccion-cab { display: flex; align-items: flex-end; gap: 12px; margin: 2px 0 14px; flex-wrap: wrap; }
.seccion-cab h2 { margin: 0; font-size: 22px; letter-spacing: -.015em; }
.seccion-cab .sub { color: var(--ink-3); font-size: 13.5px; }
.seccion-cab .der { margin-left: auto; display: flex; gap: 8px; }
.bloque-tit { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-weight: 700; }
.bloque-tit::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }

.campo {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; transition: border-color .2s, box-shadow .2s;
  animation: entrar .28s ease both;
}
@keyframes entrar { from { opacity: 0; transform: translateY(4px); } }
.campo:focus-within { border-color: color-mix(in srgb, var(--c, var(--brand)) 45%, var(--line)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, var(--brand)) 10%, transparent); }
.campo.respondido { background: linear-gradient(180deg, var(--surface), var(--surface-2)); }
.campo.respondido::before { content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, var(--brand)); }
.campo.ancho { grid-column: 1 / -1; }
.campo .lab { display: flex; align-items: flex-start; gap: 8px; font-weight: 600; font-size: 14.5px; }
.campo .lab .cod { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); font-weight: 400; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); white-space: nowrap; }
.sin-codigos .cod { display: none; }
.campo .ayuda { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
.campo .ctrl { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.campo .aviso-r { margin-top: 8px; font-size: 12.5px; color: var(--warn); display: flex; gap: 6px; align-items: center; }
.campo .aviso-r .ico { width: 15px; height: 15px; }
.prov { font-size: 10px; font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: 1px 6px; border-radius: 5px; letter-spacing: .04em; }

.sino { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--bg-2); gap: 3px; }
.sino button { height: 34px; min-width: 64px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 600; color: var(--ink-2); transition: all .15s; }
.sino button:hover { background: var(--surface); }
.sino button.si.on { background: var(--c, var(--brand)); color: #fff; box-shadow: 0 4px 12px -6px var(--c, var(--brand)); }
.sino button.no.on { background: var(--ink-2); color: var(--surface); }
.limpiar { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 4px; border-radius: 6px; display: inline-grid; }
.limpiar:hover { color: var(--bad); background: var(--bad-soft); }
.limpiar .ico { width: 16px; height: 16px; }

.opciones { display: flex; flex-wrap: wrap; gap: 6px; }
.op {
  height: 34px; padding: 0 13px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 500;
  color: var(--ink-2); transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
}
.op:hover { border-color: var(--c, var(--brand)); color: var(--ink); }
.op.on { background: var(--c, var(--brand)); border-color: var(--c, var(--brand)); color: #fff; box-shadow: 0 4px 12px -6px var(--c, var(--brand)); }
.op.cero { text-decoration: line-through; opacity: .55; }
.op .ico { width: 14px; height: 14px; }
.fecha-op { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 8px; width: 100%; animation: entrar .2s ease both; }
.fecha-op b { font-weight: 600; color: var(--ink); }

.inp {
  height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0;
}
.inp:focus { border-color: var(--c, var(--brand-2)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, var(--brand-2)) 15%, transparent); }
.inp.num { width: 130px; font-family: var(--mono); font-weight: 600; font-size: 16px; text-align: right; }
.inp.fuera { border-color: var(--warn); background: var(--warn-soft); }
.inp[type="date"] { width: 170px; }
textarea.inp { width: 100%; height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; }
.unidad { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.rango { font-size: 12px; color: var(--ink-3); }
.fijo { font-family: var(--mono); font-weight: 700; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line-2); display: inline-flex; gap: 8px; align-items: center; }
.fijo .ico { width: 16px; height: 16px; color: var(--ink-3); }

.nav-sec { display: flex; justify-content: space-between; margin-top: 26px; gap: 10px; }
.solo-lectura .campo { pointer-events: none; opacity: .85; }
.banda-lectura { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); font-weight: 600; margin-bottom: 14px; }

/* ---------- Cajón lateral (importar / historial) ---------- */
.velo { position: fixed; inset: 0; background: rgba(8, 14, 24, .45); backdrop-filter: blur(3px); z-index: 30; animation: aparecer .2s ease; }
@keyframes aparecer { from { opacity: 0; } }
.cajon {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 96vw); background: var(--surface); z-index: 31; display: flex; flex-direction: column;
  box-shadow: var(--shadow-3); animation: deslizar .28s cubic-bezier(.2, .8, .2, 1);
}
@keyframes deslizar { from { transform: translateX(40px); opacity: 0; } }
.cajon .cab { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.cajon .cab h3 { margin: 0; font-size: 18px; }
.cajon .cab .sub { font-size: 13px; color: var(--ink-3); }
.cajon .cuerpo { padding: 20px 24px; overflow: auto; flex: 1; }
.cajon .pie { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; background: var(--surface-2); }
.aviso-local { display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); font-size: 13.5px; margin-bottom: 16px; align-items: flex-start; }
.aviso-local .ico { flex: none; margin-top: 1px; }
.aviso-local b { color: var(--ink); }
.texto-informe { width: 100%; min-height: 300px; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
.vista-anon { white-space: pre-wrap; font-family: var(--mono); font-size: 12.8px; line-height: 1.6; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); max-height: 340px; overflow: auto; }
.vista-anon mark { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); border-radius: 4px; padding: 0 3px; font-weight: 700; }
.marcas { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.marcas .pill { --c: var(--bad); }
.propuesta { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; transition: border-color .15s, background .15s; cursor: pointer; }
.propuesta:hover { border-color: var(--line-2); }
.propuesta.sel { border-color: color-mix(in srgb, var(--brand-2) 60%, var(--line)); background: color-mix(in srgb, var(--brand-2) 6%, transparent); }
.propuesta input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--brand); }
.propuesta .t { font-weight: 600; font-size: 14px; }
.propuesta .f { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; font-family: var(--mono); }
.propuesta .f mark { background: color-mix(in srgb, var(--brand-2) 22%, transparent); color: var(--ink); padding: 0 2px; border-radius: 3px; }
.propuesta .val { font-family: var(--mono); font-weight: 700; font-size: 15px; text-align: right; }
.propuesta .actual { font-size: 11.5px; color: var(--warn); text-align: right; }
.propuesta .av { font-size: 12px; color: var(--warn); margin-top: 3px; }
.propuesta .otra { font-size: 11px; color: var(--ink-3); }
.pasos-mini { display: flex; gap: 6px; margin-bottom: 18px; }
.pasos-mini span { flex: 1; height: 4px; border-radius: 4px; background: var(--bg-2); }
.pasos-mini span.on { background: var(--brand-2); }

.historial { list-style: none; margin: 0; padding: 0; }
.historial li { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.historial .cuando { color: var(--ink-3); font-size: 12px; }
.historial .cambio { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.historial .cambio del { color: var(--bad); }
.historial .cambio ins { color: var(--ok); text-decoration: none; }
.origen { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }

/* ---------- Modal ---------- */
.modal { position: fixed; z-index: 41; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, 94vw); background: var(--surface); border-radius: var(--r-3); box-shadow: var(--shadow-3); animation: zoom .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes zoom { from { transform: translate(-50%, -48%) scale(.97); opacity: 0; } }
.modal .cab { padding: 22px 24px 4px; }
.modal .cab h3 { margin: 0; font-size: 19px; }
.modal .cuerpo { padding: 12px 24px 8px; color: var(--ink-2); }
.modal .pie { padding: 16px 24px 22px; display: flex; gap: 10px; justify-content: flex-end; }
.velo.alto { z-index: 40; }

/* ---------- Formularios genéricos ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .inp { width: 100%; height: 44px; font-size: 15px; }
.error { color: var(--bad); font-size: 13.5px; min-height: 18px; }

/* ---------- Toast ---------- */
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 14px; background: #0d1726; color: #fff; box-shadow: var(--shadow-3); font-size: 14px; font-weight: 500; animation: subir .3s cubic-bezier(.2, .8, .2, 1); }
.toast.ok .ico { color: #34d399; }
.toast.mal .ico { color: #f87171; }
@keyframes subir { from { transform: translateY(14px); opacity: 0; } }

/* ---------- Login ---------- */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
@media (max-width: 900px) { .login { grid-template-columns: 1fr; } .login .heroe { min-height: 260px; } }
.login .heroe {
  position: relative; overflow: hidden; color: #fff; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between;
  background: radial-gradient(80% 70% at 85% 10%, rgba(20, 184, 166, .55), transparent 60%), radial-gradient(70% 60% at 10% 100%, rgba(99, 102, 241, .45), transparent 60%), linear-gradient(160deg, #0a1626, #0d2d3b 60%, #0a1626);
}
.login .heroe h1 { font-size: 44px; line-height: 1.05; letter-spacing: -.03em; margin: 0; max-width: 520px; }
.login .heroe h1 span { background: linear-gradient(90deg, #5eead4, #a5b4fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.login .heroe p { color: rgba(255, 255, 255, .72); max-width: 460px; font-size: 16px; }
.login .heroe .ecg { position: absolute; left: 0; right: 0; top: 46%; width: 100%; height: 160px; opacity: .8; }
.login .heroe .ecg path { fill: none; stroke: url(#gradEcg); stroke-width: 2.5; stroke-dasharray: 2600; stroke-dashoffset: 2600; animation: trazo 4.5s ease-out forwards; filter: drop-shadow(0 0 6px rgba(94, 234, 212, .6)); }
.login .heroe .sellos { display: flex; gap: 10px; flex-wrap: wrap; }
.login .heroe .sellos span { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 12px; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); }
.login .heroe .sellos .ico { width: 16px; height: 16px; color: #5eead4; }
.login .lado { display: grid; place-items: center; padding: 40px 24px; background: var(--surface); }
.login .caja { width: min(400px, 100%); }
.login .caja h2 { font-size: 26px; margin: 22px 0 4px; letter-spacing: -.02em; }
.login .caja .sub { color: var(--ink-3); margin-bottom: 26px; }
.pista-demo { margin-top: 18px; font-size: 13px; padding: 12px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); }
.pista-demo code { font-family: var(--mono); color: var(--ink); background: var(--surface); padding: 1px 6px; border-radius: 5px; }

/* ---------- Libro llave ---------- */
.llave-cab {
  border-radius: var(--r-3); padding: 24px 26px; color: #fff; margin-bottom: 18px; display: flex; gap: 18px; align-items: center;
  background: radial-gradient(70% 140% at 100% 0%, rgba(245, 158, 11, .35), transparent 60%), linear-gradient(135deg, #1c1917, #3b2a14);
}
.llave-cab .ic-grande { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: rgba(251, 191, 36, .18); color: #fbbf24; }
.llave-cab .ic-grande .ico { width: 32px; height: 32px; }
.llave-cab h2 { margin: 0; font-size: 22px; }
.llave-cab p { margin: 4px 0 0; opacity: .75; font-size: 14px; max-width: 760px; }
.numero-asignado { text-align: center; padding: 26px; border-radius: 18px; background: var(--brand-soft); border: 1px dashed var(--brand-2); }
.numero-asignado .n { font-family: var(--mono); font-size: 52px; font-weight: 800; color: var(--brand); letter-spacing: .08em; }

.codigo { font-family: var(--mono); font-size: 12.5px; }
.tabla.compacta td, .tabla.compacta th { padding: 8px 12px; font-size: 13px; }
.tag-g { --c: var(--ink-3); font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); margin-right: 3px; }
.cols-prev { display: flex; flex-wrap: wrap; gap: 4px; max-height: 260px; overflow: auto; padding: 4px; }
.cols-prev span { font-family: var(--mono); font-size: 11.5px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.cols-prev span.local { border-color: var(--warn); color: var(--warn); }

.cargando { display: grid; place-items: center; min-height: 60vh; color: var(--ink-3); }
.latido-logo { width: 64px; height: 64px; color: var(--brand-2); animation: pulso 1.2s ease-in-out infinite; }
@keyframes pulso { 50% { transform: scale(1.12); opacity: .7; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .ecg path, .ecg-fondo path { stroke-dashoffset: 0 !important; } }

/* ---------- Modo navegador ---------- */
.estado-carpeta { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .08); color: var(--side-ink); transition: background .15s; }
.estado-carpeta:hover { background: rgba(255, 255, 255, .1); }
.estado-carpeta .ico { width: 20px; height: 20px; }
.estado-carpeta b { display: block; font-size: 13px; color: #fff; }
.estado-carpeta small { display: block; font-size: 11.5px; color: var(--side-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
.estado-carpeta.ok .ico { color: #34d399; }
.estado-carpeta.aviso { border-color: rgba(251, 191, 36, .4); } .estado-carpeta.aviso .ico { color: #fbbf24; }
.estado-carpeta.mal { border-color: rgba(248, 113, 113, .45); background: rgba(248, 113, 113, .1); } .estado-carpeta.mal .ico { color: #f87171; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rol { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; text-align: left; transition: all .15s; }
.rol .ico { color: var(--ink-3); margin-bottom: 4px; }
.rol b { font-size: 14px; } .rol span { font-size: 12.5px; color: var(--ink-3); }
.rol.on { border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 15%, transparent); }
.rol.on .ico { color: var(--brand); }
.carpeta-cta { display: flex; gap: 18px; align-items: flex-start; }
.carpeta-cta .ic-gr { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--warn-soft); color: var(--warn); }
.carpeta-cta.ok .ic-gr { background: var(--ok-soft); color: var(--ok); }
.carpeta-cta .ic-gr .ico { width: 28px; height: 28px; }
.carpeta-cta h3 { font-size: 17px; margin-bottom: 6px; }
.carpeta-cta p { margin: 0 0 14px; }
.pasos-guia { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); font-size: 14px; }
.pasos-guia code, .carpeta-cta code, .aviso-local code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink); }

function fragmento(texto, ini, fin) {
  const a = Math.max(0, ini - 50), b = Math.min(texto.length, fin + 50);
  return { antes: (a > 0 ? "…" : "") + texto.slice(a, ini), match: texto.slice(ini, fin), despues: texto.slice(fin, b) + (b < texto.length ? "…" : "") };
}

/** Devuelve propuestas [{id, codigo, titulo, valorTexto, cambios, frag, aviso}] */
function extraer(texto, modelo) {
  const props = [];
  const ya = new Set();
  const etq = (c) => modelo.porCodigo[c]?.etiqueta || c;
  const push = (p) => { if (!ya.has(p.id) && modelo.porCodigo[p.codigo]) { ya.add(p.id); props.push(p); } };

  // Sexo (p. ej. "Varón de 72 años")
  let m = texto.match(/\b(var[oó]n|hombre|mujer)\b(?:\s+de\s+\d{1,3}\s+a[ñn]os)?/i);
  if (m) {
    const varon = !/mujer/i.test(m[1]);
    push({ id: "sexo", codigo: "biological_sex_male", titulo: "Sexo biológico", valorTexto: varon ? "Varón" : "Mujer",
      cambios: { biological_sex_male: varon ? 1 : 0, biological_sex_female: varon ? 0 : 1 }, frag: fragmento(texto, m.index, m.index + m[0].length) });
  }

  // Tensión arterial  "TA 135/80"
  m = texto.match(/\b(?:TA|PA|T\.A\.|tensi[oó]n arterial|presi[oó]n arterial)[^\d\n]{0,15}(\d{2,3})\s*\/\s*(\d{2,3})/i);
  if (m) {
    push({ id: "ta", codigo: "systolic_blood_pressure_mean", titulo: "Presión arterial", valorTexto: `${m[1]}/${m[2]} mmHg`,
      cambios: { systolic_blood_pressure_mean: +m[1], diastolic_blood_pressure_mean: +m[2] }, frag: fragmento(texto, m.index, m.index + m[0].length) });
  }

  for (const [codigo, re, tf] of NUMERICOS) {
    const r = texto.match(re);
    if (!r) continue;
    let val = n(r[1]);
    if (tf) val = tf(val, r);
    if (!isFinite(val)) continue;
    const it = modelo.porCodigo[codigo];
    let aviso = "";
    if (it && it.min !== null && it.max !== null && (val < it.min || val > it.max)) aviso = `Fuera del rango esperado (${it.min}–${it.max})`;
    push({ id: codigo, codigo, titulo: etq(codigo), valorTexto: String(val).replace(".", ",") + (it?.unidad ? " " + it.unidad : ""),
      cambios: { [codigo]: val }, frag: fragmento(texto, r.index, r.index + r[0].length), aviso });
  }

  // NYHA
  m = texto.match(/\bNYHA\s*(?:clase\s*|grado\s*)?(IV|III|II|I|[1-4])\b/i) || texto.match(/\bclase funcional\s*(IV|III|II|I|[1-4])\b/i);
  if (m) {
    const romano = { 1: "I", 2: "II", 3: "III", 4: "IV" }[m[1]] || m[1].toUpperCase();
    const cods = ["nyha_class_i", "nyha_class_ii", "nyha_class_iii", "nyha_class_iv"];
    const elegido = "nyha_class_" + romano.toLowerCase();
    push({ id: "nyha", codigo: "nyha_class_i", titulo: "Clase funcional NYHA", valorTexto: "NYHA " + romano,
      cambios: Object.fromEntries(cods.map((c) => [c, c === elegido ? 1 : 0])), frag: fragmento(texto, m.index, m.index + m[0].length) });
  }

  // Perugini
  m = texto.match(/\bPerugini[^\d\n]{0,15}([0-3])\b/i) || texto.match(/\bgrado\s*([0-3])\s*(?:de|en la escala de)\s*Perugini\b/i);
  if (m) {
    const cods = [0, 1, 2, 3].map((g) => "scintigraphy_perugini_score_grade_" + g);
    push({ id: "perugini", codigo: cods[0], titulo: "Grado de Perugini", valorTexto: "Grado " + m[1],
      cambios: Object.fromEntries(cods.map((c, i) => [c, i === +m[1] ? 1 : 0])), frag: fragmento(texto, m.index, m.index + m[0].length) });
  }

  // TIMI
  m = texto.match(/\bTIMI\s*(?:flujo\s*)?([0-3])\b/i);
  if (m) {
    const cods = [0, 1, 2, 3].map((g) => "timi_coronary_grade_flow_" + g);
    push({ id: "timi", codigo: cods[0], titulo: "Flujo TIMI", valorTexto: "TIMI " + m[1],
      cambios: Object.fromEntries(cods.map((c, i) => [c, i === +m[1] ? 1 : 0])), frag: fragmento(texto, m.index, m.index + m[0].length) });
  }

  // Selecciones únicas
  for (const [codigo, re] of SELECCIONES) {
    const r = texto.match(re);
    if (!r) continue;
    const op = modelo.porCodigo[codigo];
    if (!op?.padre) continue;
    const padre = op.padre;
    if (ya.has("grupo:" + padre.codigo)) continue;
    ya.add("grupo:" + padre.codigo);
    const cambios = {};
    if (padre.tipoCampo === "single") padre.opciones.forEach((o) => (cambios[o.codigo] = o.codigo === codigo ? 1 : 0));
    else cambios[codigo] = 1;
    push({ id: codigo, codigo, titulo: padre.etiqueta, valorTexto: op.etiqueta, cambios, frag: fragmento(texto, r.index, r.index + r[0].length) });
  }

  // Sí / No con negación
  for (const [codigo, re] of BOOLEANOS) {
    const r = texto.match(re);
    if (!r) continue;
    const previo = texto.slice(Math.max(0, r.index - 60), r.index);
    const negado = NEGACION.test(previo);
    push({ id: codigo, codigo, titulo: etq(codigo), valorTexto: negado ? "No" : "Sí", negado,
      cambios: { [codigo]: negado ? 0 : 1 }, frag: fragmento(texto, r.index, r.index + r[0].length),
      aviso: negado ? "Detectado con negación: compruebe que es correcto" : "" });
  }

  // Fecha del informe -> fecha de eco / analítica si hay valores de esas pruebas
  m = texto.match(/\b(?:fecha(?: del? (?:estudio|informe|exploraci[oó]n))?|realizado(?: el)?)\s*[:\-]?\s*(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/i);
  if (m) {
    const y = m[3].length === 2 ? "20" + m[3] : m[3];
    const f = `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    const hayEco = props.some((p) => p.codigo.startsWith("echocardiography"));
    const hayLab = props.some((p) => /natriuretic|troponin|creatinine|glomerular/.test(p.codigo));
    if (hayEco) push({ id: "fecha_eco", codigo: "echocardiography_procedure", titulo: etq("echocardiography_procedure"), valorTexto: f.split("-").reverse().join("/"),
      cambios: { echocardiography_procedure: f }, frag: fragmento(texto, m.index, m.index + m[0].length), aviso: "Fecha tomada del informe: compruébela" });
    if (hayLab) push({ id: "fecha_lab", codigo: "laboratory_biomarkers_test", titulo: etq("laboratory_biomarkers_test"), valorTexto: f.split("-").reverse().join("/"),
      cambios: { laboratory_biomarkers_test: f }, frag: fragmento(texto, m.index, m.index + m[0].length), aviso: "Fecha tomada del informe: compruébela" });
  }
  return props;
}

async function archivoTrabajo() {

    ...cols.filter((k) => !META.includes(k)).map((k) => c.valores[k] ?? ""), JSON.stringify(c.valores)]);
  return crearXlsx([
    ["casos", [cab, ...filas]],
    ["historial", [["numero", "usuario", "fecha", "campo", "antes", "despues", "origen"], ...aud.map((a) => [a.numero, a.usuario, a.fecha, a.campo, a.antes, a.despues, a.origen])]],
    ["info", [["clave", "valor"], ["aplicacion", "Registro WILLEM"], ["version_archivo", VERSION_ARCHIVO], ["usuario", yo?.usuario], ["nombre", yo?.nombre], ["generado", ahora()],
      ["aviso", "Archivo de trabajo. No editar a mano: use la aplicación. Contiene solo números de caso (sin datos identificativos)."]]],
  ]);
}

async function leerArchivoTrabajo(buffer) {
  const h = await leerXlsx(buffer);
  if (!h.casos) err("Este Excel no es un archivo de trabajo de WILLEM");
  const [cab, ...filas] = h.casos;
  const ix = Object.fromEntries(cab.map((k, i) => [k, i]));
  const casos = filas.filter((f) => f[ix.numero]).map((f) => {
    let valores;
    try { valores = JSON.parse(f[ix.json_valores]); } catch { valores = {}; }
    return { numero: +f[ix.numero], principal: f[ix.principal], secundarias: f[ix.secundarias] ? String(f[ix.secundarias]).split(",") : [],
      estado: f[ix.estado] || "borrador", creado: f[ix.creado], creado_por: f[ix.creado_por], modificado: f[ix.modificado], modificado_por: f[ix.modificado_por], valores };
  });
  const aud = (h.historial || []).slice(1).filter((f) => f[0] != null).map((f) => ({ numero: +f[0], usuario: f[1], fecha: f[2], campo: f[3], antes: f[4] ?? null, despues: f[5] ?? null, origen: f[6] }));
  const info = Object.fromEntries((h.info || []).slice(1).map((f) => [f[0], f[1]]));
  return { casos, aud, info };
}

/** Une casos y su historial en la base de este navegador. Gana la versión modificada más recientemente. */
async function fusionar({ casos, aud }, origenNombre) {
  const rep = { archivo: origenNombre, nuevos: 0, actualizados: 0, iguales: 0, conservados: 0, conflictos: [] };
  for (const c of casos) {
    const l = await uno("casos", c.numero);
    if (!l) { await poner("casos", c); rep.nuevos++; continue; }
    if (l.creado_por !== c.creado_por && l.creado !== c.creado) {
      rep.conflictos.push(`#${String(c.numero).padStart(4, "0")}: creado por ${l.creado_por} y por ${c.creado_por} (¿número repetido?)`);
      continue;
    }
    if ((c.modificado || "") > (l.modificado || "")) { await poner("casos", c); rep.actualizados++; }
    else if ((c.modificado || "") === (l.modificado || "")) rep.iguales++;
    else rep.conservados++;
  }
  const existentes = new Set((await todos("auditoria")).map((a) => [a.numero, a.usuario, a.fecha, a.campo].join("|")));
  const nuevas = aud.filter((a) => !existentes.has([a.numero, a.usuario, a.fecha, a.campo].join("|")));
  if (nuevas.length) await auditar(nuevas);
  return rep;
}

function programarGuardado() {

  avisar();

async function vaciarGuardado() { if (estado.timer) { clearTimeout(estado.timer); estado.timer = null; await guardarAhora(); } }
window.addEventListener("pagehide", () => { if (estado.timer) guardarAhora(); });

async function guardarAhora() {
  const h = await carpeta();
  const yo = await perfil();
  if (!h || !yo) { avisar(); return false; }
  try {
    if ((await h.queryPermission({ mode: "readwrite" })) !== "granted") { estado.error = "permiso"; avisar(); return false; }
    estado.guardando = true; avisar();
    const fh = await h.getFileHandle(nombreArchivo(yo.usuario), { create: true });
    const w = await fh.createWritable();
    await w.write(await archivoTrabajo());
    await w.close();
    estado.ultimo = ahora(); estado.error = null;
    await kvSet("ultimoGuardado", estado.ultimo);
    return true;
  } catch (e) {
    estado.error = e.message || String(e);
    return false;
  } finally { estado.guardando = false; avisar(); }
}

/** Data manager: lee todos los WILLEM_*.xlsx de la carpeta y los une. */
async function unirCarpeta() {
  const h = await carpeta();
  if (!h) err("Primero vincule la carpeta compartida");
  if ((await h.queryPermission({ mode: "read" })) !== "granted" && (await h.requestPermission({ mode: "readwrite" })) !== "granted") err("Sin permiso para leer la carpeta");
  const yo = await perfil();
  const informes = [];
  for await (const [nombre, entrada] of h.entries()) {
    if (entrada.kind !== "file" || !/^WILLEM_.+\.xlsx$/i.test(nombre) || nombre === nombreArchivo(yo.usuario)) continue;
    try { informes.push(await fusionar(await leerArchivoTrabajo(await (await entrada.getFile()).arrayBuffer()), nombre)); }
    catch (e) { informes.push({ archivo: nombre, error: e.message }); }
  }
  await guardarAhora();
  return informes;
}

/** Sin carpeta (Safari/Firefox): unir archivos elegidos a mano. */
async function unirArchivos(files) {
  const informes = [];
  for (const f of files) {
    try { informes.push(await fusionar(await leerArchivoTrabajo(await f.arrayBuffer()), f.name)); }
    catch (e) { informes.push({ archivo: f.name, error: e.message }); }
  }
  programarGuardado();
  return informes;
}

function donut(datos, tam = 150, grosor = 22) {
  const total = datos.reduce((a, d) => a + d.v, 0) || 1;
  const r = (tam - grosor) / 2, c = 2 * Math.PI * r;
  let acc = 0;
  const arcos = datos.filter((d) => d.v).map((d) => {
    const l = (d.v / total) * c;
    const s = `<circle cx="${tam / 2}" cy="${tam / 2}" r="${r}" fill="none" stroke="${d.c}" stroke-width="${grosor}" stroke-dasharray="${Math.max(l - 2, 0.1)} ${c}" stroke-dashoffset="${-acc}"><title>${esc(d.t)}: ${d.v}</title></circle>`;
    acc += l; return s;
  }).join("");
  return `<svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" style="transform:rotate(-90deg)"><circle cx="${tam / 2}" cy="${tam / 2}" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="${grosor}"/>${arcos}</svg>`;
}

function barrasActividad(aud) {
  const dias = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); dias.push({ d, n: 0 }); }
  for (const a of aud) {
    const f = new Date(a.fecha); f.setHours(0, 0, 0, 0);
    const x = dias.find((d) => d.d.getTime() === f.getTime()); if (x) x.n++;
  }
  const max = Math.max(1, ...dias.map((d) => d.n));
  const W = 420, H = 130, bw = W / dias.length;
  const barras = dias.map((d, i) => {
    const h = Math.max(3, (d.n / max) * (H - 26));
    return `<rect x="${i * bw + 5}" y="${H - 18 - h}" width="${bw - 10}" height="${h}" rx="5" fill="url(#gB)"><title>${d.d.toLocaleDateString("es-ES")}: ${d.n} cambios</title></rect>
      ${i % 2 === 0 ? `<text x="${i * bw + bw / 2}" y="${H - 3}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${d.d.getDate()}/${d.d.getMonth() + 1}</text>` : ""}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}"><defs><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e" stop-opacity=".5"/></linearGradient></defs>${barras}</svg>`;
}

    $("#ant") && ($("#ant").onclick = () => { W.paso--; pintar(); });
    if (W.paso === 1) {
      const inp = $("#num"); inp.focus(); inp.select();
      const ir = () => { const n = parseInt(inp.value.replace(/\D/g, ""), 10); if (!n) return toast("Escriba un número de caso válido", "mal"); if (S.casos.some((c) => c.numero === n)) return toast(`El caso #${pad(n)} ya existe`, "mal"); W.numero = n; W.paso = 2; pintar(); };
      $("#sig").onclick = ir; inp.onkeydown = (e) => e.key === "Enter" && ir();
    }
    if (W.paso === 2) {
      $$("[data-g]", cont).forEach((x) => (x.onclick = () => { W.principal = x.dataset.g; W.sec = W.sec.filter((s) => s !== W.principal); pintar(); }));
      $$("[data-g]", cont).forEach((x) => (x.ondblclick = () => { W.principal = x.dataset.g; W.paso = 3; pintar(); }));
      $("#sig").onclick = () => { W.paso = 3; pintar(); };
    }
    if (W.paso === 3) {
      $$("[data-s]", cont).forEach((x) => (x.onclick = () => { const g = x.dataset.s; W.sec = W.sec.includes(g) ? W.sec.filter((s) => s !== g) : [...W.sec, g]; pintar(); }));
      $("#crear").onclick = async () => {
        try { await api("POST", "casos", { numero: W.numero, principal: W.principal, secundarias: W.sec }); toast(`Caso #${pad(W.numero)} creado`); location.hash = `#/caso/${W.numero}`; }
        catch (e) { toast(e.message, "mal"); }
      };
    }
  };
  await cargarCasos();
  pintar();
}

const soloLectura = () => E.caso?.estado === "validado" && !esDM();

async function pCaso(num, tabId) {
  if (!S.casos.length) await cargarCasos();
  E.caso = await api("GET", "casos/" + num);
  E.pend = {}; E.origen = null;
  const tabs = pestanasDelCaso(S.modelo, E.caso);
  E.tab = tabs.find((t) => t.id === tabId) ? tabId : tabs.find((t) => t.principal)?.id || tabs[0].id;
  const e = ENFERMEDADES[E.caso.principal];
  barra(`Caso #${pad(num)}`, `<a href="#/casos">Casos</a> › ${esc(e.nombre)}`,
    `<button class="btn" id="bImp">${icono("importar")} Importar informe</button><button class="btn fantasma" id="bHist">${icono("historial")} Historial</button>`);
  $("#bImp").onclick = abrirImportador;
  $("#bHist").onclick = abrirHistorial;
  pintarCaso(true);
}

function pintarCaso(animar = false) {
  const c = E.caso, e = ENFERMEDADES[c.principal];
  const tabs = pestanasDelCaso(S.modelo, c);
  if (!tabs.find((t) => t.id === E.tab)) E.tab = tabs[0].id;
  const tab = tabs.find((t) => t.id === E.tab);
  const ti = tabs.indexOf(tab);
  const prog = progresoItems(tabs.flatMap((t) => t.bloques.flatMap((b) => b.items)), c.valores);
  const pt = progresoPestana(tab, c.valores);
  const tColor = tab.grupo ? ENFERMEDADES[tab.grupo].color : e.color;
  let nSec = 0;
  const cont = $("#contenido");
  const scroll = scrollY;
  const foco = document.activeElement?.dataset?.foco;

  cont.style.setProperty("--c", e.color);

    <div class="cabecera-caso" style="--c:${e.color}">
      <div class="ic-grande">${icono(c.principal)}</div>
      <div><div class="t1">Enfermedad principal</div>
        <div class="t2">${esc(e.nombre)} <span class="num-caso">#${pad(c.numero)}</span></div>
        <div class="secs">${c.secundarias.map((s) => `<span class="pill sec">${icono(s)} ${esc(ENFERMEDADES[s].nombre)}</span>`).join("")}
          ${soloLectura() ? "" : `<button class="btn pequeno" id="bDiag">${icono("editar")} Diagnósticos</button>`}</div></div>
      <div class="der">
        <span class="guardado" id="guardado">${icono("check")} Guardado</span>
        <select id="selEstado" ${soloLectura() ? "disabled" : ""}>
          <option value="borrador" ${c.estado === "borrador" ? "selected" : ""}>Borrador</option>
          <option value="completo" ${c.estado === "completo" ? "selected" : ""}>Completo</option>
          ${esDM() || c.estado === "validado" ? `<option value="validado" ${c.estado === "validado" ? "selected" : ""}>Validado</option>` : ""}
        </select>
        ${anillo(prog.pct, 64, 6, "#fff")}
      </div>
    </div>
    ${soloLectura() ? `<div class="banda-lectura">${icono("candado")} Caso validado por un data manager: solo lectura.</div>` : ""}
    <div class="editor ${soloLectura() ? "solo-lectura" : ""}">
      <nav class="tarjeta indice">
        ${tabs.map((t, i) => {
          const p = progresoPestana(t, c.valores);
          const col = t.grupo ? ENFERMEDADES[t.grupo].color : "var(--brand)";
          const sep = i > 0 && tabs[i - 1].grupo && !t.grupo ? `<div class="sep"></div><div class="titulo-ind">Datos comunes</div>` : i === 1 && t.grupo ? `<div class="titulo-ind">Enfermedades</div>` : "";
          if (!t.grupo) nSec++;
          return `${sep}<a href="#/caso/${c.numero}/${encodeURIComponent(t.id)}" class="${t.id === E.tab ? "activo" : ""} ${p.pct === 100 ? "ok" : ""}" style="--c:${col}" data-tab="${esc(t.id)}">
            ${t.grupo ? `<span class="marca-enf">${icono(t.grupo)}</span>` : `<span class="n-sec">${p.pct === 100 ? "✓" : nSec}</span>`}
            <span class="t">${esc(t.titulo)}<span class="p">${t.principal ? "Principal · " : ""}${p.ok}/${p.tot} · ${p.pct}%</span></span>
            <span class="mini-barra"><i style="width:${p.pct}%"></i></span></a>`;
        }).join("")}
      </nav>
      <div style="--c:${tColor}">

          <div>${tab.grupo ? pillEnf(tab.grupo) : ""}<h2 style="margin-top:${tab.grupo ? 8 : 0}px">${esc(tab.titulo)}</h2>
            <div class="sub">${pt.ok} de ${pt.tot} respondidos${tab.grupo ? " · campos específicos de esta enfermedad" : ""}</div></div>
          <div class="der">${soloLectura() ? "" : `<button class="btn" id="bRellenar" title="Pone No (0) en todos los Sí/No que estén sin contestar en esta pestaña">${icono("varita")} Marcar el resto como No</button>`}</div>
        </div>

    await vaciarPendientes();
    if (prog.pct < 100) toast(`Faltan ${prog.tot - prog.ok} campos por responder`, "info");

    location.hash = "#/casos";
  });
  $("#bRellenar")?.addEventListener("click", async () => {
    const items = tab.bloques.flatMap((b) => b.items);
    const cambios = rellenarNo(items, c.valores);
    const n = Object.keys(cambios).length;
    if (!n) return toast("No hay preguntas Sí/No pendientes en esta pestaña", "info");
    const ok = await modal({ titulo: "Marcar el resto como No", aceptar: `Poner No en ${n}`, html: `<p>Se pondrá <b>No (0)</b> en las preguntas Sí/No de <b>${esc(tab.titulo)}</b> que estén sin contestar.</p><p class="sub">Los números, fechas y listas de una sola opción no se tocan. Quedará anotado en el historial.</p>` });
    if (ok) { aplicar(cambios, "relleno_no"); toast(`${n} respuestas puestas a No`); }

function campoHTML(it, v, animar) {
  const cod = `<span class="cod" title="Código en el registro">${esc(it.codigo)}</span>`;
  const prov = it.provisional ? ` <span class="prov" title="Este código no existe en el CRF oficial">PROVISIONAL</span>` : "";
  const ayuda = it.ayuda && !/^DUPLICADO|Solapa/.test(it.ayuda) ? `<div class="ayuda">${esc(it.ayuda)}</div>` : "";
  const est = animar ? "" : ' style="animation:none"';
  const resp = (() => {
    switch (it.tipoCampo) {
      case "single": return it.opciones.some((o) => v[o.codigo] === 1);
      case "multi": return it.opciones.some((o) => v[o.codigo] != null);
      default: return v[it.codigo] != null && v[it.codigo] !== "";
    }
  })();
  const cab = `<div class="lab"><span>${esc(it.etiqueta)}${prov}</span>${cod}</div>${ayuda}`;
  const fechaInp = (k, val) => `<input type="date" class="inp" data-in="${esc(k)}" data-t="fecha" data-foco="${esc(k)}" value="${esc(val || "")}" max="${new Date().toISOString().slice(0, 10)}">`;
  const limpiar = (ks) => `<button class="limpiar" data-limpiar="${esc(ks.join(","))}" title="Borrar respuesta">${icono("x")}</button>`;
  let ctrl = "", ancho = false, aviso = "";

  switch (it.tipoCampo) {
    case "fijo":
      ctrl = `<span class="fijo">${icono("candado")} ${esc(it.fijo || v[it.codigo] || "")}</span>`; break;
    case "caso":
      ctrl = `<span class="fijo">${icono("candado")} #${pad(E.caso.numero)}</span>`; break;
    case "sino":
    case "sinofecha": {
      const x = v[it.codigo];
      ctrl = `<div class="sino"><button class="si ${x === 1 ? "on" : ""}" data-sino="${esc(it.codigo)}" data-val="1" data-foco="${esc(it.codigo)}:1">Sí</button><button class="no ${x === 0 ? "on" : ""}" data-sino="${esc(it.codigo)}" data-val="0" data-foco="${esc(it.codigo)}:0">No</button></div>
        ${x != null ? limpiar([it.codigo, it.codigo + "_date"]) : ""}`;
      if (it.tipoCampo === "sinofecha" && x === 1) ctrl += `<div class="fecha-op">${icono("historial")} <b>Fecha</b> ${fechaInp(it.codigo + "_date", v[it.codigo + "_date"])}</div>`;
      break;
    }
    case "single":
    case "multi": {
      ancho = it.opciones.length > 5;
      const multi = it.tipoCampo === "multi";
      ctrl = `<div class="opciones">${it.opciones.map((o) => {
        const x = v[o.codigo];
        return `<button class="op ${x === 1 ? "on" : ""} ${multi && x === 0 ? "cero" : ""}" data-g="${esc(it.codigo)}" data-o="${esc(o.codigo)}" data-foco="${esc(o.codigo)}" title="${esc(o.codigo)}">${multi && x === 1 ? icono("check") : ""}${esc(o.etiqueta)}</button>`;
      }).join("")}</div>${it.opciones.some((o) => v[o.codigo] != null) ? limpiar(it.opciones.flatMap((o) => [o.codigo, o.codigo + "_date"])) : ""}`;
      if (it.conFecha) ctrl += `<div class="fecha-op">${icono("historial")} <b>Fecha</b> ${fechaInp(it.codigo, v[it.codigo])}</div>`;
      for (const o of it.opciones) if (o.conFecha && v[o.codigo] === 1) ctrl += `<div class="fecha-op">${icono("historial")} <b>Fecha · ${esc(o.etiqueta)}</b> ${fechaInp(o.codigo + "_date", v[o.codigo + "_date"])}</div>`;
      if (multi) ctrl += `<div class="ayuda" style="width:100%">Las opciones no marcadas se guardan como No.</div>`;
      break;
    }
    case "numero":
    case "entero": {
      const x = v[it.codigo];
      const fuera = x != null && ((it.min != null && x < it.min) || (it.max != null && x > it.max));
      ctrl = `<input class="inp num ${fuera ? "fuera" : ""}" data-in="${esc(it.codigo)}" data-t="${it.tipoCampo}" data-foco="${esc(it.codigo)}" inputmode="decimal" value="${x == null ? "" : String(x).replace(".", ",")}">
        ${it.unidad ? `<span class="unidad">${esc(it.unidad)}</span>` : ""}${it.min != null && it.max != null ? `<span class="rango">${String(it.min).replace(".", ",")}–${String(it.max).replace(".", ",")}</span>` : ""}`;
      if (fuera) aviso = `<div class="aviso-r">${icono("aviso")} Fuera del rango esperado. Compruebe el valor.</div>`;
      break;
    }
    case "fecha":
      ctrl = fechaInp(it.codigo, v[it.codigo]); break;
    default:
      ancho = true;
      ctrl = `<textarea class="inp" data-in="${esc(it.codigo)}" data-t="texto" data-foco="${esc(it.codigo)}" placeholder="Texto libre…">${esc(v[it.codigo] || "")}</textarea>`;
  }
  return `<div class="campo ${resp ? "respondido" : ""} ${ancho ? "ancho" : ""}" data-k="${esc(it.codigo)}"${est}>${cab}<div class="ctrl">${ctrl}</div>${aviso}</div>`;
}

function alClicar(ev) {
  if (soloLectura()) return;
  const v = E.caso.valores;
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.sino) {
    const k = b.dataset.sino, val = +b.dataset.val;
    const cambios = { [k]: val };
    if (val === 0 && v[k + "_date"]) cambios[k + "_date"] = null;
    aplicar(cambios);
  } else if (b.dataset.limpiar) {
    aplicar(Object.fromEntries(b.dataset.limpiar.split(",").map((k) => [k, null])));
  } else if (b.dataset.o) {
    const g = S.modelo.porCodigo[b.dataset.g], o = b.dataset.o;
    const cambios = {};
    if (g.tipoCampo === "single") {
      if (v[o] === 1) g.opciones.forEach((x) => { cambios[x.codigo] = null; cambios[x.codigo + "_date"] = null; });
      else g.opciones.forEach((x) => { cambios[x.codigo] = x.codigo === o ? 1 : 0; if (x.codigo !== o) cambios[x.codigo + "_date"] = null; });
    } else {
      cambios[o] = v[o] === 1 ? 0 : 1;
      if (cambios[o] === 0) cambios[o + "_date"] = null;
      g.opciones.forEach((x) => { if (x.codigo !== o && v[x.codigo] == null) cambios[x.codigo] = 0; });
    }
    for (const k of Object.keys(cambios)) if (cambios[k] === null && v[k] == null) delete cambios[k];
    aplicar(cambios);
  }
}

function alCambiar(ev) {
  if (soloLectura()) return;
  const el = ev.target;
  if (!el.dataset.in) return;
  const k = el.dataset.in, t = el.dataset.t;
  let val = el.value.trim();
  if (t === "numero" || t === "entero") {
    if (val === "") val = null;
    else {
      const x = Number(val.replace(/\s/g, "").replace(",", "."));
      if (!isFinite(x)) { toast("Escriba un número (use coma o punto para decimales)", "mal"); el.value = E.caso.valores[k] ?? ""; return; }
      if (t === "entero" && !Number.isInteger(x)) { toast("Este campo es un número entero", "mal"); el.value = E.caso.valores[k] ?? ""; return; }
      val = x;
    }
  } else if (val === "") val = null;
  aplicar({ [k]: val });
}

function aplicar(cambios, origen = "formulario") {
  if (E.origen && E.origen !== origen) vaciarPendientes();
  E.origen = origen;
  for (const [k, val] of Object.entries(cambios)) {
    if (val === null || val === undefined) delete E.caso.valores[k];
    else E.caso.valores[k] = val;
    E.pend[k] = val ?? null;
  }
  clearTimeout(E.timer);
  E.timer = setTimeout(vaciarPendientes, 450);
  actualizarGuardado("pendiente");
  requestAnimationFrame(() => pintarCaso(false));
}

async function vaciarPendientes(keepalive = false) {
  clearTimeout(E.timer);
  if (!E.caso || !Object.keys(E.pend).length) return;
  const cuerpo = { valores: E.pend, origen: E.origen || "formulario" };
  const num = E.caso.numero;
  E.pend = {}; E.origen = null;
  actualizarGuardado("guardando");
  try {
    const r = await api("PUT", "casos/" + num, cuerpo, { keepalive });
    if (E.caso?.numero === num) {
      E.caso.estado = r.estado; E.caso.modificado = r.modificado;
      // mantener valores locales con cambios aún no enviados
      E.caso.valores = { ...r.valores, ...Object.fromEntries(Object.entries(E.pend).filter(([, x]) => x !== null)) };
      for (const [k, x] of Object.entries(E.pend)) if (x === null) delete E.caso.valores[k];
    }
    actualizarGuardado("ok");
  } catch (e) {
    actualizarGuardado("error");
    toast("No se pudo guardar: " + e.message, "mal");
  }
}

function actualizarGuardado(estado) {
  const g = $("#guardado");
  if (!g) return;
  estado = estado || (Object.keys(E.pend).length ? "pendiente" : "ok");
  g.className = "guardado " + (estado === "guardando" || estado === "pendiente" ? "guardando" : "");
  g.innerHTML = {
    ok: `${icono("check")} Guardado`, pendiente: `${icono("historial")} Guardando…`, guardando: `${icono("historial")} Guardando…`, error: `${icono("aviso")} Sin guardar`,
  }[estado];
}
window.addEventListener("beforeunload", () => vaciarPendientes(true));

async function editarDiagnosticos() {
  const c = E.caso;
  let P = c.principal, sec = [...c.secundarias];
  await modal({
    titulo: "Diagnósticos del caso", aceptar: "Guardar",
    html: `<div class="sub" style="margin-bottom:10px">Enfermedad principal</div><div class="opciones" id="dP"></div>
      <div class="sub" style="margin:16px 0 10px">Otros diagnósticos</div><div class="opciones" id="dS"></div>
      <p class="sub" style="margin-top:16px">Si cambia la enfermedad principal, los datos ya introducidos <b>no se borran</b>: simplemente dejan de mostrarse si no corresponden.</p><div class="error"></div>`,
    alAbrir: (m) => {
      const pin = () => {
        $("#dP", m).innerHTML = PRINCIPALES.map((g) => `<span class="chip ${P === g ? "on" : ""}" data-p="${g}" style="--c:${ENFERMEDADES[g].color}">${icono(g)} ${esc(ENFERMEDADES[g].corto)}</span>`).join("");
        $("#dS", m).innerHTML = Object.keys(ENFERMEDADES).filter((g) => g !== P).map((g) => `<span class="chip ${sec.includes(g) ? "on" : ""}" data-s="${g}" style="--c:${ENFERMEDADES[g].color}">${icono(g)} ${esc(ENFERMEDADES[g].corto)}</span>`).join("");
        $$("[data-p]", m).forEach((x) => (x.onclick = () => { P = x.dataset.p; sec = sec.filter((s) => s !== P); pin(); }));
        $$("[data-s]", m).forEach((x) => (x.onclick = () => { const g = x.dataset.s; sec = sec.includes(g) ? sec.filter((s) => s !== g) : [...sec, g]; pin(); }));
      };
      pin();
    },
    alAceptar: async () => {
      await vaciarPendientes();
      E.caso = await api("PUT", "casos/" + c.numero, { principal: P, secundarias: sec });
      toast("Diagnósticos actualizados");
      pCaso(c.numero, E.tab);
    },
  });
}

// ---------------------------------------------------------------------------

function cajon(titulo, sub, icon) {
  const velo = document.createElement("div"); velo.className = "velo";
  const cj = document.createElement("aside"); cj.className = "cajon";
  cj.innerHTML = `<div class="cab"><div class="kpi" style="padding:0"><div class="ic">${icono(icon)}</div></div><div><h3>${esc(titulo)}</h3><div class="sub">${sub}</div></div>
    <button class="btn fantasma btn-icono" style="margin-left:auto" data-cerrar>${icono("x")}</button></div><div class="cuerpo"></div><div class="pie"></div>`;
  const cerrar = () => { velo.remove(); cj.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = (e) => e.key === "Escape" && cerrar();
  velo.onclick = cerrar; cj.querySelector("[data-cerrar]").onclick = cerrar;
  document.addEventListener("keydown", tecla);
  document.body.append(velo, cj);
  return { cuerpo: $(".cuerpo", cj), pie: $(".pie", cj), cerrar };
}

async function abrirHistorial() {
  const c = E.caso;
  const cj = cajon(`Historial del caso #${pad(c.numero)}`, "Quién cambió qué y cuándo", "historial");
  cj.pie.remove();
  const aud = await api("GET", "auditoria?caso=" + c.numero + "&limite=500");
  const etq = (k) => {
    const base = k.replace(/_date$/, "");
    const it = S.modelo.porCodigo[k] || S.modelo.porCodigo[base];
    if (!it) return k;
    const pre = it.padre ? it.padre.etiqueta + " › " : "";
    return pre + it.etiqueta + (k.endsWith("_date") && !S.modelo.porCodigo[k] ? " (fecha)" : "");
  };
  const fmt = (x) => x == null ? "∅" : x === "1" ? "Sí" : x === "0" ? "No" : x;
  cj.cuerpo.innerHTML = aud.length ? `<ul class="historial">${aud.map((a) => `<li><div><div>${esc(fmtFecha(a.fecha))}</div><div class="cuando">${esc(a.fecha.slice(11, 16))} · ${esc(a.usuario)}</div></div>
    <div><div><b>${esc(a.campo.startsWith("(") ? a.campo.slice(1, -1) : etq(a.campo))}</b> ${a.origen !== "formulario" ? `<span class="origen">${a.origen === "importacion" ? "informe" : "relleno No"}</span>` : ""}</div>
    <div class="cambio"><del>${esc(fmt(a.antes))}</del> → <ins>${esc(fmt(a.despues))}</ins></div></div></li>`).join("")}</ul>` : `<div class="vacio">Sin cambios registrados</div>`;
}

//  IMPORTADOR DE INFORMES (local)

function abrirImportador() {
  if (soloLectura()) return toast("Caso validado: solo lectura", "mal");
  const cj = cajon("Importar informe", "Pegue el texto de un informe: se anonimiza y se extraen los datos aquí mismo", "importar");
  const I = { paso: 1, original: "", anon: null, props: [], sel: new Set(), editar: false, cabecera: true };
  const v = E.caso.valores;
  const tabsVis = new Set(pestanasDelCaso(S.modelo, E.caso).flatMap((t) => t.bloques.flatMap((b) => b.items.flatMap((i) => [i.codigo, ...(i.opciones || []).map((o) => o.codigo)]))));

  const pintar = () => {
    const pasos = `<div class="pasos-mini">${[1, 2, 3].map((n) => `<span class="${I.paso >= n ? "on" : ""}"></span>`).join("")}</div>`;
    const aviso = `<div class="aviso-local">${icono("candado")}<div><b>Todo ocurre en este ordenador.</b> El texto no se envía a ningún sitio y no se guarda: solo se guardan los datos que usted acepte.</div></div>`;
    if (I.paso === 1) {
      cj.cuerpo.innerHTML = `${pasos}${aviso}
        <textarea class="inp texto-informe" id="txt" placeholder="Pegue aquí el informe (eco, alta, consulta, analítica)…  Desde un PDF: seleccione todo (Ctrl+A), copie (Ctrl+C) y pegue (Ctrl+V).">${esc(I.original)}</textarea>
        <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px"><input type="checkbox" id="cab" ${I.cabecera ? "checked" : ""}> Quitar las líneas de cabecera con datos del paciente</label>`;
      cj.pie.innerHTML = `<button class="btn fantasma" id="ej" style="margin-right:auto">${icono("ojo")} Cargar un ejemplo ficticio</button><button class="btn primario" id="sig">${icono("escudo")} Anonimizar</button>`;
      $("#ej", cj.pie).onclick = () => { I.original = EJEMPLO; pintar(); };
      $("#sig", cj.pie).onclick = () => {
        I.original = $("#txt", cj.cuerpo).value; I.cabecera = $("#cab", cj.cuerpo).checked;
        if (!I.original.trim()) return toast("Pegue primero el texto del informe", "mal");
        I.anon = anonimizar(I.original, { quitarCabecera: I.cabecera }); I.paso = 2; I.editar = false; pintar();
      };
      $("#txt", cj.cuerpo).focus();
    } else if (I.paso === 2) {
      const tipos = {};
      I.anon.marcas.forEach((m) => (tipos[m.tipo] = (tipos[m.tipo] || 0) + 1));
      cj.cuerpo.innerHTML = `${pasos}
        <h3 style="margin:0 0 4px">Revise el texto anonimizado</h3>
        <div class="sub">En rojo lo que se ha ocultado. Si ve algún nombre u otro dato identificativo, pulse <b>Editar a mano</b> y bórrelo.</div>
        <div class="marcas">${Object.entries(tipos).map(([t, n]) => `<span class="pill sec">${esc(t)} · ${n}</span>`).join("") || `<span class="sub">No se ha detectado ningún identificador.</span>`}</div>
        ${I.editar ? `<textarea class="inp texto-informe" id="ed">${esc(I.anon.texto)}</textarea>`
          : `<div class="vista-anon">${esc(I.anon.texto).replace(/\[[A-ZÁÉÍÓÚÑ\/. ]{2,}\]/g, (m) => `<mark>${m}</mark>`)}</div>`}`;
      cj.pie.innerHTML = `<button class="btn fantasma" id="ant" style="margin-right:auto">${icono("flechaI")} Atrás</button>
        <button class="btn" id="edit">${icono("editar")} ${I.editar ? "Ver resaltado" : "Editar a mano"}</button><button class="btn primario" id="sig">${icono("varita")} Extraer datos</button>`;
      const leer = () => { if (I.editar) I.anon.texto = $("#ed", cj.cuerpo).value; };
      $("#ant", cj.pie).onclick = () => { I.paso = 1; pintar(); };
      $("#edit", cj.pie).onclick = () => { leer(); I.editar = !I.editar; pintar(); };
      $("#sig", cj.pie).onclick = () => {
        leer();
        I.props = extraer(I.anon.texto, S.modelo);
        I.sel = new Set(I.props.filter((p) => tabsVis.has(p.codigo) && Object.entries(p.cambios).every(([k]) => v[k] == null)).map((p) => p.id));
        I.paso = 3; pintar();
      };
    } else {
      const actual = (p) => {
        const dif = Object.entries(p.cambios).filter(([k, x]) => v[k] != null && v[k] !== x);
        return dif.length ? "Ya tiene otro valor: se sustituirá" : Object.entries(p.cambios).every(([k, x]) => v[k] === x) ? "Igual al valor actual" : "";
      };
      cj.cuerpo.innerHTML = `${pasos}
        <h3 style="margin:0 0 4px">${I.props.length} dato${I.props.length === 1 ? "" : "s"} encontrado${I.props.length === 1 ? "" : "s"}</h3>
        <div class="sub" style="margin-bottom:14px">Marque los que quiera incorporar. Debajo de cada uno verá la frase del informe de donde sale.</div>
        ${I.props.map((p) => `<label class="propuesta ${I.sel.has(p.id) ? "sel" : ""}" data-id="${esc(p.id)}">
          <input type="checkbox" ${I.sel.has(p.id) ? "checked" : ""}>
          <div><div class="t">${esc(p.titulo)}</div><div class="f">${esc(p.frag.antes)}<mark>${esc(p.frag.match)}</mark>${esc(p.frag.despues)}</div>
            ${p.aviso ? `<div class="av">${icono("aviso")} ${esc(p.aviso)}</div>` : ""}${!tabsVis.has(p.codigo) ? `<div class="otra">Campo de otra patología: no visible en este caso</div>` : ""}</div>
          <div><div class="val">${esc(p.valorTexto)}</div><div class="actual">${esc(actual(p))}</div></div></label>`).join("") || `<div class="vacio">${icono("buscar")}<p>No se han reconocido datos en este texto.</p></div>`}`;
      cj.pie.innerHTML = `<button class="btn fantasma" id="ant" style="margin-right:auto">${icono("flechaI")} Atrás</button>
        <button class="btn" id="todos">Marcar todos</button><button class="btn primario" id="ok" ${I.sel.size ? "" : "disabled"}>${icono("check")} Incorporar ${I.sel.size}</button>`;
      $$(".propuesta", cj.cuerpo).forEach((el) => el.querySelector("input").onchange = (ev) => { ev.target.checked ? I.sel.add(el.dataset.id) : I.sel.delete(el.dataset.id); pintar(); });
      $("#ant", cj.pie).onclick = () => { I.paso = 2; pintar(); };
      $("#todos", cj.pie).onclick = () => { I.props.forEach((p) => I.sel.add(p.id)); pintar(); };
      $("#ok", cj.pie).onclick = () => {
        const cambios = {};
        I.props.filter((p) => I.sel.has(p.id)).forEach((p) => Object.assign(cambios, p.cambios));
        aplicar(cambios, "importacion");
        vaciarPendientes();
        toast(`${I.sel.size} datos incorporados desde el informe`);
        cj.cerrar();
      };
    }
  };
  pintar();
}
